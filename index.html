<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de venta</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #28a745;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #218838;
    }

    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="card">

    <h2>Registro de venta</h2>

    <form id="formulario">

      <input
        type="text"
        id="nombre"
        placeholder="Nombre completo"
        required
      >

      <input
        type="text"
        id="tarjetaCelular"
        placeholder="Número de tarjeta o celular"
        inputmode="numeric"
        required
      >

      <input
        type="number"
        id="cantidad"
        placeholder="Cantidad de productos"
        min="1"
        step="1"
        required
      >

      <input
        type="text"
        id="producto"
        placeholder="Nombre del producto"
        required
      >

      <input
        type="number"
        id="iva"
        placeholder="IVA"
        min="0"
        step="0.01"
        required
      >

      <input
        type="number"
        id="total"
        placeholder="Total"
        min="0"
        step="0.01"
        required
      >

      <button
        type="submit"
        id="btnEnviar"
      >
        Enviar Registro
      </button>

    </form>

    <p id="mensaje"></p>

  </div>


  <script>

    const URL_WEB_APP =
      "const URL_WEB_APP =  
      "https://script.google.com/macros/s/AKfycbxEY5hJmfwkrm2GRj_cuFWMj-92J4pF6QWv2hSLhT8TASQ0CM78pklulwEG7l7Mxij2Og/exec";

    document
      .getElementById("formulario")
      .addEventListener("submit", function(e) {

        e.preventDefault();

        const btn =
          document.getElementById("btnEnviar");

        const msg =
          document.getElementById("mensaje");


        btn.disabled = true;
        btn.innerText = "Enviando...";

        msg.style.color = "black";
        msg.innerHTML = "⏳ Procesando...";


        const datos = {

          nombre:
            document.getElementById("nombre").value,

          tarjetaCelular:
            document.getElementById("tarjetaCelular").value,

          cantidad:
            document.getElementById("cantidad").value,

          producto:
            document.getElementById("producto").value,

          iva:
            document.getElementById("iva").value,

          total:
            document.getElementById("total").value

        };


        fetch(URL_WEB_APP, {

          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type": "text/plain"
          },

          body: JSON.stringify(datos)

        })

        .then(() => {

          msg.style.color = "green";

          msg.innerHTML =
            "✅ ¡Registro enviado correctamente!";

          document
            .getElementById("formulario")
            .reset();

        })

        .catch(error => {

          msg.style.color = "red";

          msg.innerHTML =
            "❌ Error de conexión.";

          console.error("Error:", error);

        })

        .finally(() => {

          btn.disabled = false;

          btn.innerText = "Enviar Registro";

        });

      });

  </script>

</body>

</html>
