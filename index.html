<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Venta</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #28a745;
    }

    input[readonly] {
      background-color: #e9ecef;
      color: #495057;
      cursor: not-allowed;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #218838;
    }

    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>Registro de venta</h2>

    <form id="formulario">

      <input
        type="text"
        id="nombre"
        placeholder="Nombre completo"
        required
      >

      <input
        type="text"
        id="tarjetaCelular"
        placeholder="Número de tarjeta o celular"
        inputmode="numeric"
        required
      >

      <input
        type="text"
        id="producto"
        placeholder="Nombre del producto"
        required
      >

      <input
        type="number"
        id="cantidad"
        placeholder="Cantidad de productos"
        min="1"
        step="1"
        required
      >

      <input
        type="number"
        id="precioUnitario"
        placeholder="Precio unitario ($)"
        min="0"
        step="0.01"
        required
      >

      <input
        type="text"
        id="comision"
        placeholder="Comisión (10%)"
        readonly
      >

      <input
        type="text"
        id="total"
        placeholder="Total final"
        readonly
      >

      <button type="submit" id="btnEnviar">
        Enviar Registro
      </button>

    </form>

    <p id="mensaje"></p>

  </div>

  <script>
    const URL_WEB_APP =
      "https://script.google.com/macros/s/AKfycbxlob7rhWYTRwM9TcCPUZiWV0xWpGq2tED4qC30EYYLhZFZqqHRyd-9o69b1q7I1Kv5gQ/exec";

    const PORCENTAJE_COMISION = 0.10;

    const inputCantidad = document.getElementById("cantidad");
    const inputPrecioUnitario = document.getElementById("precioUnitario");
    const inputComision = document.getElementById("comision");
    const inputTotal = document.getElementById("total");

    function calcularTotales() {
      const cantidad = parseFloat(inputCantidad.value) || 0;
      const precioUnitario = parseFloat(inputPrecioUnitario.value) || 0;

      const subtotal = cantidad * precioUnitario;
      const comision = subtotal * PORCENTAJE_COMISION;
      const totalFinal = subtotal + comision;

      inputComision.value = comision.toFixed(2);
      inputTotal.value = totalFinal.toFixed(2);
    }

    inputCantidad.addEventListener("input", calcularTotales);
    inputPrecioUnitario.addEventListener("input", calcularTotales);

    document
      .getElementById("formulario")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const btn = document.getElementById("btnEnviar");
        const msg = document.getElementById("mensaje");

        btn.disabled = true;
        btn.innerText = "Enviando...";

        msg.style.color = "black";
        msg.innerHTML = "⏳ Procesando...";

        const datos = {
          nombre: document.getElementById("nombre").value.trim(),
          tarjetaCelular: document.getElementById("tarjetaCelular").value.trim(),
          producto: document.getElementById("producto").value.trim(),
          cantidad: inputCantidad.value,
          precioUnitario: inputPrecioUnitario.value,
          comision: inputComision.value,
          total: inputTotal.value
        };

        try {

          const respuesta = await fetch(URL_WEB_APP, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(datos)
          });

          const resultado = await respuesta.json();

          if (resultado.resultado === "ok") {

            msg.style.color = "green";
            msg.innerHTML = "✅ ¡Registro guardado correctamente!";

            document.getElementById("formulario").reset();
            
            inputComision.value = "";
            inputTotal.value = "";

          } else {

            throw new Error(
              resultado.error || "Error al guardar el registro."
            );

          }

        } catch (error) {

          console.error("Error:", error);

          msg.style.color = "red";
          msg.innerHTML = "❌ No se pudo guardar: " + error.message;

        } finally {

          btn.disabled = false;
          btn.innerText = "Enviar Registro";

        }

      });
  </script>

</body>

</html>
