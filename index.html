<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de venta</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; background-color: #f4f4f9; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.12); width: 100%; max-width: 420px; }
    h2 { text-align: center; margin-top: 0; margin-bottom: 25px; color: #333; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; margin-top: 15px; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #218838; }
    button:disabled { background-color: #999; cursor: not-allowed; }
    #mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Registro de venta</h2>
    <form id="formulario">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="text" id="tarjetaCelular" placeholder="Tarjeta o celular" required>
      <input type="number" id="cantidad" placeholder="Cantidad" required>
      <input type="text" id="producto" placeholder="Producto" required>
      <input type="number" id="comision" placeholder="Comisión" step="0.01" required>
      <input type="number" id="total" placeholder="Total" step="0.01" required>
      <button type="submit" id="btnEnviar">Enviar Registro</button>
    </form>
    <p id="mensaje"></p>
  </div>

  <script>
    // ✅ URL NUEVA PUESTA AQUÍ
    const URL = "https://script.google.com/macros/s/AKfycbzOKwr-v-qucBRwPBIPyFXsncVQdbjVR4ZWgvkHT0DTdJppX3rtPJ6VKmUXn8u-fCHwww/exec";

    document.getElementById("formulario").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = document.getElementById("btnEnviar");
      const msg = document.getElementById("mensaje");
      btn.disabled = true;
      btn.innerText = "Enviando...";
      msg.innerText = "⏳ Procesando...";
      msg.style.color = "black";

      const datos = {
        nombre: document.getElementById("nombre").value.trim(),
        tarjetaCelular: document.getElementById("tarjetaCelular").value.trim(),
        cantidad: document.getElementById("cantidad").value,
        producto: document.getElementById("producto").value.trim(),
        comision: document.getElementById("comision").value,
        total: document.getElementById("total").value
      };

      try {
        const res = await fetch(URL, {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify(datos)
        });

        const resultado = await res.json();
        if (resultado.resultado === "ok") {
          msg.style.color = "green";
          msg.innerText = "✅ ¡Guardado correctamente!";
          e.target.reset();
        } else {
          throw new Error(resultado.error || "Error desconocido");
        }
      } catch (err) {
        msg.style.color = "red";
        msg.innerText = "❌ Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "Enviar Registro";
      }
    });
  </script>
</body>
</html>
